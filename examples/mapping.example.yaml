# Logical names (yours) -> how to find the BambooHR thing. A key may be a numeric id, an alias, or a display name
# (compared ignoring case and stray whitespace). Aliases are generated by BambooHR, so do not guess them: the validator reads them back.
# A display name shared by several fields is an error that lists the candidate ids; use the id or alias instead.

employee_fields:
  shirt_size: "Shirt Size"
  hired:      hireDate                # a standard field, by alias

tables:
  equipment:                          # your name for the table
    table_alias: customEquipment      # tables have no display name in the API: alias only
    columns:                          # resolved INSIDE that table, where display names are unique
      category: "Item category"
      serial:   "Serial #"
